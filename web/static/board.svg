<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500">
  <defs>
    <!-- Wood grain pattern for the frame -->
    <pattern id="wood-frame" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#5c3a1e"/>
      <line x1="0" y1="10" x2="200" y2="15" stroke="#6b4423" stroke-width="2" opacity="0.4"/>
      <line x1="0" y1="30" x2="200" y2="28" stroke="#4a2e14" stroke-width="1.5" opacity="0.3"/>
      <line x1="0" y1="55" x2="200" y2="58" stroke="#6b4423" stroke-width="2.5" opacity="0.35"/>
      <line x1="0" y1="72" x2="200" y2="70" stroke="#4a2e14" stroke-width="1" opacity="0.25"/>
      <line x1="0" y1="95" x2="200" y2="98" stroke="#6b4423" stroke-width="2" opacity="0.3"/>
      <line x1="0" y1="120" x2="200" y2="118" stroke="#4a2e14" stroke-width="1.5" opacity="0.35"/>
      <line x1="0" y1="145" x2="200" y2="148" stroke="#6b4423" stroke-width="2" opacity="0.3"/>
      <line x1="0" y1="168" x2="200" y2="165" stroke="#4a2e14" stroke-width="1" opacity="0.25"/>
      <line x1="0" y1="190" x2="200" y2="193" stroke="#6b4423" stroke-width="2" opacity="0.4"/>
    </pattern>

    <!-- Felt texture for playing surface -->
    <filter id="felt-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey-noise"/>
      <feComponentTransfer in="grey-noise" result="faint-noise">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint-noise" mode="multiply"/>
    </filter>

    <!-- Bar wood pattern -->
    <pattern id="wood-bar" patternUnits="userSpaceOnUse" width="40" height="200">
      <rect width="40" height="200" fill="#5c3a1e"/>
      <line x1="0" y1="8" x2="40" y2="10" stroke="#6b4423" stroke-width="1.5" opacity="0.4"/>
      <line x1="0" y1="25" x2="40" y2="23" stroke="#4a2e14" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="45" x2="40" y2="47" stroke="#6b4423" stroke-width="2" opacity="0.35"/>
      <line x1="0" y1="65" x2="40" y2="63" stroke="#4a2e14" stroke-width="1" opacity="0.25"/>
      <line x1="0" y1="88" x2="40" y2="90" stroke="#6b4423" stroke-width="1.5" opacity="0.3"/>
      <line x1="0" y1="110" x2="40" y2="108" stroke="#4a2e14" stroke-width="1" opacity="0.35"/>
      <line x1="0" y1="135" x2="40" y2="137" stroke="#6b4423" stroke-width="2" opacity="0.3"/>
      <line x1="0" y1="158" x2="40" y2="156" stroke="#4a2e14" stroke-width="1" opacity="0.25"/>
      <line x1="0" y1="180" x2="40" y2="182" stroke="#6b4423" stroke-width="1.5" opacity="0.4"/>
    </pattern>

    <!-- Tray inset gradient -->
    <linearGradient id="tray-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="50%" stop-color="#234d23"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </linearGradient>
  </defs>

  <!-- Outer frame (wood) -->
  <rect x="0" y="0" width="840" height="500" rx="8" ry="8" fill="url(#wood-frame)"/>

  <!-- Inner frame border (routed edge) -->
  <rect x="22" y="22" width="796" height="456" rx="3" ry="3" fill="none" stroke="#3d2210" stroke-width="2" opacity="0.6"/>

  <!-- Playing surface (green felt) -->
  <rect x="25" y="25" width="790" height="450" fill="#2d6b2d" filter="url(#felt-texture)"/>
  <rect x="25" y="25" width="790" height="450" fill="#287028" opacity="0.3"/>

  <!-- Central bar (wood divider) -->
  <rect x="400" y="22" width="40" height="456" fill="url(#wood-bar)"/>
  <line x1="400" y1="22" x2="400" y2="478" stroke="#3d2210" stroke-width="1.5" opacity="0.5"/>
  <line x1="440" y1="22" x2="440" y2="478" stroke="#3d2210" stroke-width="1.5" opacity="0.5"/>
  <line x1="401" y1="22" x2="401" y2="478" stroke="#7a5030" stroke-width="0.5" opacity="0.3"/>

  <!-- Borne-off trays -->
  <rect x="789" y="25" width="36" height="218" rx="2" ry="2" fill="url(#tray-grad)" stroke="#3d2210" stroke-width="1.5"/>
  <rect x="789" y="257" width="36" height="218" rx="2" ry="2" fill="url(#tray-grad)" stroke="#3d2210" stroke-width="1.5"/>

  <!-- Decorative brass corner studs -->
  <circle cx="12" cy="12" r="4" fill="#b8963a" opacity="0.6"/>
  <circle cx="828" cy="12" r="4" fill="#b8963a" opacity="0.6"/>
  <circle cx="12" cy="488" r="4" fill="#b8963a" opacity="0.6"/>
  <circle cx="828" cy="488" r="4" fill="#b8963a" opacity="0.6"/>
</svg>